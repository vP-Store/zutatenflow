<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cockpit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="win-menu">
        <button id="win-menu-btn" class="win-btn" aria-haspopup="true" aria-expanded="false">
          <span class="win-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          Windows
          <span class="chev" aria-hidden="true">▾</span>
        </button>
        <div id="win-menu" class="dropdown" role="menu" hidden>
          <button data-action="hide" role="menuitem"><span class="di" data-icon="windows"></span>Zu Windows wechseln <kbd id="kbd-toggle">Strg + Alt + D</kbd></button>
          <button data-action="explorer" role="menuitem"><span class="di" data-icon="folder"></span>Windows-Explorer öffnen</button>
          <button data-action="taskmgr" role="menuitem"><span class="di" data-icon="chart"></span>Task-Manager</button>
          <hr>
          <button data-action="lock" role="menuitem"><span class="di" data-icon="lock"></span>Sperren</button>
          <button data-action="sleep" role="menuitem"><span class="di" data-icon="moon"></span>Energie sparen</button>
          <button data-action="logoff" role="menuitem"><span class="di" data-icon="logout"></span>Abmelden</button>
          <button data-action="restart" role="menuitem"><span class="di" data-icon="restart"></span>Neu starten</button>
          <button data-action="shutdown" role="menuitem"><span class="di" data-icon="power"></span>Herunterfahren</button>
          <hr>
          <button data-action="quit" role="menuitem" class="danger"><span class="di" data-icon="close"></span>Cockpit beenden <kbd id="kbd-quit">Strg + Alt + Q</kbd></button>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Apps, Dateien oder im Internet suchen …">
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <div class="clock" id="clock">
        <span class="time">--:--</span>
        <span class="date"></span>
      </div>
    </header>

    <nav class="sidebar" id="sidebar">
      <button data-view="home" class="active"><span class="ni" data-icon="home"></span><span>Start</span></button>
      <button data-view="apps"><span class="ni" data-icon="apps"></span><span>Apps</span></button>
      <button data-view="files"><span class="ni" data-icon="folder"></span><span>Dateien</span></button>
      <button data-view="web"><span class="ni" data-icon="globe"></span><span>Internet</span></button>
      <div class="spacer"></div>
      <button data-view="settings"><span class="ni" data-icon="gear"></span><span>Einstellungen</span></button>
    </nav>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="mock-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
